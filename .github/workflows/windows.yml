# The Windows script on a real Windows (Windows PowerShell 5.1): set up by hand, then run by its scheduled task as
# SYSTEM, with script block logging on. Fails on every warning or error the PowerShell logs get meanwhile (4104
# "suspicious", 4100 "system error" ...) - a customer would see them as coming from WhatsOnMyNet - and when the
# reports do not arrive. Runs for changes of the host scripts and by button.
name: Windows script

on:
  pull_request:
    paths:
      - 'src/hostscripts/**'
      - 'src/hostscripts.js'
      - 'src/tls.js'
      - 'tools/wincheck/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # both server versions (WhatsOnMyNet runs on many servers; client Windows are not offered as runners)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # one step: a process started in a step ends with it
      - name: Run the script (by hand, then twice as scheduled task) against a stand-in for WhatsOnMyNet
        shell: powershell
        run: |
          $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"
          $work = Join-Path $env:RUNNER_TEMP 'wincheck'
          $srv = Start-Process -FilePath node -ArgumentList 'tools/wincheck/serve.mjs', $work -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'serve.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'serve.err')
          for ($i = 0; $i -lt 60 -and -not (Select-String -Path (Join-Path $env:RUNNER_TEMP 'serve.log') -Pattern 'listening' -Quiet -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
          Get-Content (Join-Path $env:RUNNER_TEMP 'serve.log')
          tools/wincheck/run.ps1 -Work $work
          $code = $LASTEXITCODE
          Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:RUNNER_TEMP 'serve.log')
          exit $code
      - name: PowerShell logs without warnings or errors
        shell: powershell
        run: tools/wincheck/events.ps1 -Work (Join-Path $env:RUNNER_TEMP 'wincheck')
      - name: Remove again (uninstall script)
        if: always()
        shell: powershell
        run: |
          $u = Join-Path $env:RUNNER_TEMP 'wincheck\womn-host-uninstall.ps1'
          if (Test-Path $u) { & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $u; "uninstall: exit code $LASTEXITCODE" }
          if (Get-ScheduledTask -TaskName 'WhatsOnMyNet-Host' -ErrorAction SilentlyContinue) { 'task still there'; exit 1 }
          if (Test-Path 'HKLM:\SOFTWARE\WhatsOnMyNet') { 'registry key still there'; exit 1 }
      - name: Logs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wincheck-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/wincheck/events.txt
            ${{ runner.temp }}/wincheck/reports.jsonl
            ${{ runner.temp }}/serve.log
            ${{ runner.temp }}/serve.err
          retention-days: 7

  # Windows Server 2012 to 2019 are not offered as runners: their PowerShell (3.0, 4.0, 5.1) is checked from recorded
  # profiles instead - syntax, commands and .NET types the scripts use
  older-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Scripts as handed out
        run: node tools/wincheck/render.mjs "$RUNNER_TEMP/compat"
      - name: PSScriptAnalyzer (fixed version)
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
      - name: Compatible with Server 2012, 2012 R2, 2016, 2019 and Windows 10/11
        shell: pwsh
        run: tools/wincheck/compat.ps1 -Dir (Join-Path $env:RUNNER_TEMP 'compat')
