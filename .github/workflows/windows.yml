# The Windows script on a real Windows (Windows PowerShell 5.1): set up by hand, then run by its scheduled task as
# SYSTEM, with script block logging on. Fails on every warning or error the PowerShell logs get meanwhile (4104
# "suspicious", 4100 "system error" ...) - a customer would see them as coming from WhatsOnMyNet - and when the
# reports do not arrive. Runs for changes of the host scripts and by button.
name: Windows script

on:
  pull_request:
    paths:
      - 'src/hostscripts/**'
      - 'src/hostscripts.js'
      - 'src/tls.js'
      - 'tools/wincheck/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Stand-in for WhatsOnMyNet (certificate and script as the program makes them)
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"
          $work = Join-Path $env:RUNNER_TEMP 'wincheck'
          Start-Process -FilePath node -ArgumentList 'tools/wincheck/serve.mjs', $work -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'serve.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'serve.err')
          for ($i = 0; $i -lt 60 -and -not (Test-Path (Join-Path $work 'womn-host.ps1')); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          Get-Content (Join-Path $env:RUNNER_TEMP 'serve.log'), (Join-Path $env:RUNNER_TEMP 'serve.err') -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $work 'womn-host.ps1'))) { exit 1 }
      - name: Run the script (by hand, then twice as scheduled task)
        shell: powershell
        run: tools/wincheck/run.ps1 -Work (Join-Path $env:RUNNER_TEMP 'wincheck')
      - name: PowerShell logs without warnings or errors
        shell: powershell
        run: tools/wincheck/events.ps1 -Work (Join-Path $env:RUNNER_TEMP 'wincheck')
      - name: Remove again (uninstall script)
        if: always()
        shell: powershell
        run: |
          $u = Join-Path $env:RUNNER_TEMP 'wincheck\womn-host-uninstall.ps1'
          if (Test-Path $u) { & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $u; "uninstall: exit code $LASTEXITCODE" }
          if (Get-ScheduledTask -TaskName 'WhatsOnMyNet-Host' -ErrorAction SilentlyContinue) { 'task still there'; exit 1 }
      - name: Logs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wincheck
          path: |
            ${{ runner.temp }}/wincheck/events.txt
            ${{ runner.temp }}/wincheck/reports.jsonl
            ${{ runner.temp }}/serve.log
            ${{ runner.temp }}/serve.err
          retention-days: 7
