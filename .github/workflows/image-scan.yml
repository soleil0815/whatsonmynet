# Daily check of the PUBLISHED image (latest): are there fixable HIGH/CRITICAL vulnerabilities
# that a new build would fix (new Alpine/Node packages, updated dependencies)?
# If so, an issue is opened (or updated). It changes nothing itself: the security update on patch day (second
# Tuesday of the month, security-update.yml) brings the fix – for an urgent fix start it by hand
# (Actions → Security update → Run workflow). Same rule as in all programs.
# The issue is closed automatically once the published image is clean again.
name: Image scan

on:
  schedule:
    - cron: '47 5 * * *'   # every day 05:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Trivy (fixed version, SHA-256 checked, no GitHub Action)
        run: sh .github/scripts/install-trivy.sh "$RUNNER_TEMP/trivy"
      - name: Scan latest (amd64)
        run: sh .github/scripts/trivy-scan.sh "$IMAGE:latest" trivy-amd64.json
      - name: Scan latest (arm64)
        run: sh .github/scripts/trivy-scan.sh "$IMAGE:latest" trivy-arm64.json linux/arm64
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh .github/scripts/scan-issue.sh trivy-amd64.json trivy-arm64.json
